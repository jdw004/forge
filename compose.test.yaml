services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge-test
      POSTGRES_DB: forge_test
    ports:
      - "127.0.0.1:${FORGE_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
