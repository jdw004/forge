global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: forge-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_token
    static_configs:
      - targets: [api:8080]

  # Docker DNS returns the addresses of all replicas of the worker service.
  # Each address becomes a separate scrape target with its own instance label.
  - job_name: forge-workers
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_token
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
        refresh_interval: 5s
